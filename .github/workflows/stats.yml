name: refresh stats
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run stats generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Generate animated contribution graph
        id: snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            contrib-snake.svg?palette=github-light&color_snake=#216e39
            contrib-snake-dark.svg?palette=github-dark&color_snake=#39d353

      - name: Move animated graph into repo root
        run: cp ${{ steps.snake.outputs.outputs_dir }}/*.svg .

      - name: Commit and push changes
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg hd-*.svg contrib-snake.svg contrib-snake-dark.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No stats changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
